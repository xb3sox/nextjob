appId: com.turbostarter.core
env:
  E2E_USER_EMAIL: me+user@turbostarter.dev
  E2E_USER_PASSWORD: "Pa$$w0rd"
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: welcome-login
    timeout: 120000
- tapOn:
    id: welcome-login
- tapOn:
    id: login-tab-password
    optional: true
- tapOn:
    id: login-email-input
- inputText: ${E2E_USER_EMAIL}
- tapOn:
    id: login-tab-password
- tapOn:
    id: login-password-input
- inputText: ${E2E_USER_PASSWORD}
- pressKey: Enter
- repeat:
    times: 3
    while:
      visible: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
- extendedWaitUntil:
    visible:
      id: setup-step-continue
    timeout: 120000
- repeat:
    times: 3
    while:
      visible: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
- runFlow: ../../subflows/complete-setup.yaml
- extendedWaitUntil:
    visible:
      id: dashboard-home
    timeout: 120000
- assertVisible:
    id: dashboard-home
- assertVisible:
    id: user-menu
