name: CI / Publish / Web

on:
  workflow_dispatch:

jobs:
  tests:
    name: 🧪 Tests
    secrets: inherit
    uses: ./.github/workflows/tests.yml

  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    environment: Production
    needs: [tests]
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔨 Setup
        uses: ./tooling/github/setup

      - name: 💾 Cache Vercel CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vercel-cli-cache
        with:
          path: ~/.local/share/pnpm/global
          key: ${{ runner.os }}-pnpm-global-vercel-59.25.4

      - name: 🔼 Install Vercel CLI
        if: steps.vercel-cli-cache.outputs.cache-hit != 'true'
        run: pnpm install --global vercel@59.25.4

      - name: 💪 Pull environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 📦 Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 💨 Publish!
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
