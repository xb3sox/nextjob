name: deploy-cloudflare

# Manual only. Vercel still owns the live deployment until you cut over.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Free-plan repo: required reviewers are rejected (422 "ensure the billing
    # plan supports the required reviewers protection rule"), so this is a
    # branch restriction, not an approval gate. The `production` environment
    # allows only `main` and has `can_admins_bypass` disabled, so a dispatch
    # from any other branch is refused for every actor, admins included.
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy
        run: bunx wrangler@4.152.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
