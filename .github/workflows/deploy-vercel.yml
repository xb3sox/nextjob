name: deploy-vercel

# Vercel owns the live site. Deploys happen only from a release tag (see
# docs/OPERATING_MODEL.md: "Release — tag v0.x.y + generated notes; deploy only
# from a tag"), or by hand from the Actions tab.
#
# Required repository secrets:
#   VERCEL_TOKEN        – account token with access to the project
#   VERCEL_ORG_ID       – team/user id from `vercel project ls`
#   VERCEL_PROJECT_ID   – project id from `vercel project ls`
#
# The Vercel CLI reads VERCEL_TOKEN from the environment; it is never passed on
# the command line, where it would appear in the process table.
#
# Build-time `VITE_*` values are NOT passed here on purpose: `vercel pull`
# fetches the project's production env, so the Vercel project stays the single
# source of truth and cannot drift from the repository secrets.
#
# Until the three secrets exist this workflow fails fast with an actionable
# message instead of a confusing CLI error.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Pinned major: `latest` would let an upstream release change what ships.
      VERCEL_CLI_VERSION: '65'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check required secrets
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # A tag must never ship an unverified tree, so the CI gates run again.
      # The production build itself is produced by `vercel build` below — running
      # `bun run build` here as well would compile the SPA twice.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: bunx vitest run --maxWorkers 2

      - name: Pull Vercel environment
        run: bunx "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production

      - name: Build with Vercel
        run: bunx "vercel@$VERCEL_CLI_VERSION" build --prod

      - name: Deploy prebuilt artifact
        id: deploy
        run: |
          url=$(bunx "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
