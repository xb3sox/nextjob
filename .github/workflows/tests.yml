name: CI / Tests

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v7

      - name: 🔨 Setup
        uses: ./tooling/github/setup

      - name: 🖌️ Format
        run: node --run format

      - name: 🛻 Lint
        run: node --run lint -- --format=github

      - name: 🧪 Test
        run: node --run test
