name: main-guard

# Fallback guard for unblocked direct pushes to main.
# With the repository public, native branch protection rules require green CI
# before merging. If an admin bypasses or an unverified commit reaches main,
# this workflow reverts the offending commit automatically.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  issues: write

concurrency:
  group: main-guard
  cancel-in-progress: false

jobs:
  revert:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'Revert')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Revert the failing commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          git config user.name "main-guard[bot]"
          git config user.email "main-guard@users.noreply.github.com"
          git revert --no-edit "$SHA" -m 1 || { echo "::error::revert conflicted; needs a human"; exit 1; }
          git commit --amend -m "Revert \"$(git log -1 --format=%s "$SHA")\"" \
            -m "Automatic revert: CI failed on main (${RUN_URL})." \
            -m "This reverts commit ${SHA}."
          git push origin HEAD:main || echo "::warning::Branch protection blocked direct push to main"

      - name: Report the revert as an issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          OUTCOME: ${{ job.status }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "main-guard: CI failed on main for ${SHA:0:7}" \
            --body "CI failed on \`main\` for commit ${SHA}.

          Run: ${RUN_URL}
          Guard outcome: ${OUTCOME}

          If the revert succeeded, main is back at the previous commit. Fix the failure on a branch and open a PR.
          If the revert conflicted, main is still broken and needs a manual revert." \
            --label "type:bug" || true
