name: CI / E2E / Web

on:
  pull_request:
    branches: ["*"]
    types: [opened, synchronize, labeled]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  e2e:
    name: ${{ matrix.label }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e') || contains(github.event.pull_request.labels.*.name, 'e2e-web')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chrome
            label: 🌐 Chrome
          - project: firefox
            label: 🦊 Firefox
          - project: safari
            label: 🧭 Safari

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔨 Setup
        uses: ./tooling/github/setup

      - name: 🐘 Start services
        uses: ./tooling/github/docker

      - name: 📋 Setup environment
        run: |
          cp .env.example .env
          cp apps/web/.env.example apps/web/.env.local

      - name: 🏷️ Store Playwright version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --filter web | grep @playwright | sed 's/.*@//')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.project }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: 🎭 Install Playwright
        run: |
          browser="${{ matrix.project }}"
          [ "$browser" = "chrome" ] && browser=chromium
          [ "$browser" = "safari" ] && browser=webkit
          pnpm --filter web exec playwright install --with-deps "$browser"

      - name: 🧪 Run E2E
        run: pnpm with-env pnpm --filter web exec playwright test --project='${{ matrix.project }}*'

      - name: 📎 Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-${{ matrix.project }}-report
          path: apps/web/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: 📎 Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-${{ matrix.project }}-results
          path: apps/web/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
