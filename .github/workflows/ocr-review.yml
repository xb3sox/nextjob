name: AI Review

# Runs OpenCodeReview on PRs from trusted actors or maintainer-approved labels.
# In a public repo, pull_request_target must be gated to prevent untrusted
# forks from consuming tokens, writing spam comments, or prompt injection.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ocr:
    if: >-
      github.event.pull_request.draft == false &&
      (
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-approved')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned by commit SHA: this repo requires SHA pinning and allows this
      # action pattern explicitly. Tag v1.13.3 = 375f64c.
      - uses: alibaba/open-code-review@375f64cd6f67a48a135da83cfcf59c52669a09cb
        with:
          # Pin the CLI too; `latest` drifts under you.
          ocr_version: '1.13.3'
          llm_url: ${{ vars.OCR_LLM_URL }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_auth_token: ${{ secrets.OCR_LLM_TOKEN }}
          llm_use_anthropic: 'false'
          # Free endpoints reject provider-specific body keys (Gemini does).
          llm_extra_body: '{}'
          effort: medium
          # A 22-file PR (T-47) estimated ~242k tokens and tripped the old
          # 150000 cap. Cover that; review_concurrency stays 1 (one group).
          max_tokens_budget: '400000'
          # Free Gemini keys cap at 20 req/day on full Flash and 429 hard when
          # several groups run at once. Use a *-flash-lite model and one group;
          # gemini-3.1-flash-lite at effort medium was the tested combo.
          review_concurrency: '1'
          review_task_timeout: '10'
          language: English
          background: >-
            Bun + TypeScript monorepo (React 18 / Vite / Supabase / Drizzle /
            Temporal). Packages under packages/*. Use Zod at every API and AI
            boundary. Never log secrets, PII, or raw CV content.
          # File filters and the review rule live in .opencodereview/rule.json.
          # The action has no `exclude` input; that gate is the repo file only.
          route_severity_below: low
          sticky_summary: 'true'
          incremental: 'true'
          checkpoint_range: 'true'
          upload_artifacts: 'true'
