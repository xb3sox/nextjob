name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Critical advisories block. High advisories are reported, not blocked:
      # six dev-only highs are outstanding (vite, happy-dom, undici, source-map-js,
      # body-parser, zod) and are tracked for a dependency pass.
      - name: Audit (critical)
        run: bun audit --audit-level=critical

      - name: Audit (high, report only)
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Build
        run: bun run build

      - name: Test
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: bunx vitest run --maxWorkers 2
