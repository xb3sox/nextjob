name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Every package typechecks cleanly under strict tsc; gate all of them so
      # the debt cleared in T-113 cannot drift back.
      - name: Typecheck (packages/api)
        run: bunx tsc --noEmit -p packages/api/tsconfig.json

      - name: Typecheck (packages/profile)
        run: bunx tsc --noEmit -p packages/profile/tsconfig.json

      - name: Typecheck (packages/ai-gateway)
        run: bunx tsc --noEmit -p packages/ai-gateway/tsconfig.json

      - name: Typecheck (packages/tailoring)
        run: bunx tsc --noEmit -p packages/tailoring/tsconfig.json

      - name: Typecheck (packages/applications)
        run: bunx tsc --noEmit -p packages/applications/tsconfig.json

      - name: Typecheck (packages/shared)
        run: bunx tsc --noEmit -p packages/shared/tsconfig.json

      # Guards the schema -> migration contract: a schema edit without a
      # regenerated migration leaves the database behind the code.
      # `git status` rather than `git diff`: a new migration is an untracked
      # file, and `git diff` only reports tracked paths.
      - name: Check migrations are in sync with the schema
        run: |
          bun run db:generate
          changed="$(git status --porcelain -- packages/api/drizzle)"
          if [ -n "$changed" ]; then
            echo "::error::packages/api/src/db/schema.ts changed without a committed migration. Run 'bun run db:generate' and commit packages/api/drizzle/."
            echo "$changed"
            exit 1
          fi

      - name: Lint
        run: bun run lint

      # Critical advisories block. High advisories are reported, not blocked:
      # See docs/AUDIT.md for the current high advisory and remediation work.
      - name: Audit (critical)
        run: bun audit --audit-level=critical

      - name: Audit (high, report only)
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Build
        run: bun run build

      - name: Test
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: bunx vitest run --maxWorkers 2

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: nextjob-web-dist
          path: dist/
          retention-days: 7

      - name: Upload Extension Build Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: nextjob-extension-chrome-mv3
          path: extension/.output/chrome-mv3/
          retention-days: 14
