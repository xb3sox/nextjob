name: Bug
description: Something is broken in a shipped surface.
title: "bug: "
labels: ["type:bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Observed behaviour, plus the exact error text if there is one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser or OS, branch or commit, and whether it reproduces on `main`.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Failing test output, console errors, or a screenshot. Never paste secrets or user PII.
