name: Task
description: One task, one PR. Agent-executable brief.
title: "[TASK]: T-XX "
body:
  - type: markdown
    attributes:
      value: |
        Contract: `docs/OPERATING_MODEL.md` § Issue contract. One issue = one task = one PR.
        Every section is required. A checkbox no command can check is not acceptance criteria.

  - type: input
    id: task-id
    attributes:
      label: Task ID
      description: The TASKS.md identifier (e.g. T-19). Write "new" if it is not in TASKS.md.
      placeholder: T-19
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: Mirrors the project `Phase` field.
      options:
        - "1. Environment & Infrastructure"
        - "6. Policy & Approvals"
        - "7. Browser Extension & Connectors"
        - "8. Applications & Receipts"
        - "9. Notifications & Outcomes"
        - "10. Organizations & B2B"
        - "11. Billing"
        - "12. Admin Console"
        - "13. Testing & Evaluation"
        - "14. Security & Privacy"
        - "15. Observability & Monitoring"
        - "16. CI/CD & Deployment"
        - "17. Documentation"
        - "18. Application State Machine"
        - "19. Failure & Edge Cases"
        - "20. Accessibility & Localization"
        - "21. Analytics & Experimentation"
        - "22. Monetization"
        - "23. Rollout & Documentation"
        - "24. Marketing & Landing Page"
        - "25. Performance Excellence"
        - "26. Advanced SEO"
        - "27. Conversion Optimization"
        - "28. Visual Excellence"
        - "29. Content Strategy"
        - "30. Trust & Credibility"
        - "31. Technical Excellence"
        - "32. Growth Infrastructure"
        - "33. Monitoring & Optimization"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Observable fact, not a wish. Cite file:line where it lives.
      placeholder: |
        `src/components/JobCard.tsx:41` renders eligibility as a boolean, so UNKNOWN shows as Eligible.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in, and what this must not become.
      value: |
        - In: 
        - Out: 
    validations:
      required: true

  - type: textarea
    id: start-here
    attributes:
      label: Start here
      description: Exact files and symbols to read first.
      placeholder: |
        - `src/pages/TailorPage.tsx` — the page to change
        - `packages/tailoring/src/index.ts` — existing API to call, do not fork it
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One box per verifiable outcome. Each must name the command or artifact that proves it.
      value: |
        - [ ] `bunx vitest run packages/x` passes with the new case in `x.test.ts`
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: test
    attributes:
      label: Test requirement
      description: First line is the exact command to run.
      value: |
        ```
        bunx vitest run --maxWorkers 2
        ```
    validations:
      required: true

  - type: textarea
    id: guardrails
    attributes:
      label: Guardrails
      description: Forbidden actions, files not to touch, and when to stop instead of guessing.
      value: |
        - No new dependency. No stack change.
        - Protected paths unchanged: `docs/PRD.md`, `docs/TECH.md`, `evals/`, `packages/policy/`, `packages/eligibility/`.
        - Max 400 changed lines; otherwise split into sub-issues.
        - Stop and comment if: a dependency is unmerged, criteria conflict, a credential is needed, or the change leaves the files named above.
    validations:
      required: true

  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: Task IDs or issue numbers that must merge first. Native "blocked by" is the truth; this is a pointer.

  - type: markdown
    attributes:
      value: |
        ## Definition of done

        - [ ] Every acceptance box checked, each backed by a test or a recorded artifact
        - [ ] `bun run typecheck`, `bun run lint`, `bunx vitest run --maxWorkers 2`, `bun run build` green locally
        - [ ] PR body carries the evidence (commands + output), links this issue with `Closes #`
        - [ ] `TASKS.md` updated with the task marked complete and its verification line

        Board: https://github.com/users/xb3sox/projects/11
