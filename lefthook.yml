pre-commit:
  parallel: true
  commands:
    format:
      run: pnpm format:fix {staged_files}
      stage_fixed: true
      glob:
        - "*.{js,ts,tsx,jsx,mjs,cjs,json,css,md,mdx}"
    lint:
      run: pnpm lint:fix {staged_files}
      stage_fixed: true
      glob:
        - "*.{js,ts,tsx,jsx,mjs,cjs}"
