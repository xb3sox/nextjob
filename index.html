    <script type="application/ld+json">
    {

      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How is NextJob different from other AI job tools?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "NextJob is the only AI career agent that constrains generation to verified evidence. We never fabricate experience, we check eligibility before you apply, and we provide verified receipts for every submission."
          }

        {
          "@type": "Question",
          "name": "Is my data safe?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. We use encryption at rest and in transit, tenant isolation, and never sell your data. You can export or delete your data at any time. We're GDPR compliant and privacy-first by design."
          }
        },
        {
          "@type": "Question",
          "name": "What if I'm an international candidate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "NextJob is built for global candidates. We check work authorization, sponsorship requirements, and location restrictions before showing you opportunities."
          }

    <!-- Progressive Enhancement: Fallback styles for no-JS -->
    <style>
      html, body { margin: 0; padding: 0; background-color: #020617; color: #f1f5f9; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      
      /* Loading indicator */
      #root:empty::before {
        content: 'Loading NextJob...';
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-size: 1.125rem;
        color: #94a3b8;
      }
      
      /* No-JS fallback content */
      .noscript-content {
        max-width: 800px;
        margin: 0 auto;
        padding: 3rem 1.5rem;
        text-align: center;
      }
      
      .noscript-content h1 {
        font-size: 2.25rem;
        font-weight: 700;
        margin-bottom: 1rem;
        background: linear-gradient(to right, #34d399, #22d3ee);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .noscript-content p {
        font-size: 1.125rem;
        color: #cbd5e1;
        margin-bottom: 1.5rem;
        line-height: 1.6;
      }
      
      .noscript-content a {
        color: #34d399;
        text-decoration: underline;
      }
      
      .noscript-content a:hover {
        color: #22d3ee;
      }
      
      /* Hide noscript content when JS is enabled */
      .js-enabled .noscript-content {
        display: none;
      }
    </style>
    
    <!-- Detect JavaScript -->
    <script>
      document.documentElement.classList.add('js-enabled');
    </script>
