    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://nextjob.ai/" />
    <meta property="twitter:title" content="NextJob — Apply with Proof | AI Career Agent" />
    <meta property="twitter:description" content="The trustworthy AI career agent that converts verified career evidence into eligible, high-quality applications." />
    <meta property="twitter:image" content="https://nextjob.ai/og-image.png" />
    <meta property="twitter:image:alt" content="NextJob — Apply with Proof. AI career agent that turns verified career evidence into eligible, high-quality applications." />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://nextjob.ai/" />
    
    <!-- Hreflang for internationalization -->
    <link rel="alternate" hreflang="en" href="https://nextjob.ai/" />
    <link rel="alternate" hreflang="x-default" href="https://nextjob.ai/" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0b0d0c" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "NextJob",
          "url": "https://nextjob.ai",
          "logo": "https://nextjob.ai/logo.png",
          "description": "AI career agent that converts verified career evidence into eligible, high-quality applications."
        },
        {
          "@type": "WebSite",
          "name": "NextJob",
          "url": "https://nextjob.ai"
        },
        {
          "@type": "SoftwareApplication",
          "name": "NextJob",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "description": "AI career agent that converts verified career evidence into eligible, high-quality applications."
        }
      ]
    }
    </script>
    
    <!-- Font Preloading -->
    <link rel="preload" href="/fonts/figtree-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Progressive Enhancement: Fallback styles for no-JS -->
    <style>
      html, body { margin: 0; padding: 0; background-color: #0b0d0c; color: #f1f5f9; font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      
      /* Loading indicator */
      #root:empty::before {
        content: 'Loading NextJob...';
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-size: 1.125rem;
        color: #94a3b8;
      }
      
      /* No-JS fallback content */
      .noscript-content {
        max-width: 800px;
        margin: 0 auto;
        padding: 3rem 1.5rem;
        text-align: center;
      }
      
      .noscript-content h1 {
        font-size: 2.5rem;
        font-weight: 400;
        font-family: 'Instrument Serif', Georgia, serif;
        letter-spacing: -0.01em;
        margin-bottom: 1rem;
        color: #34d399;
      }
      
      .noscript-content p {
        font-size: 1.125rem;
        color: #cbd5e1;
        margin-bottom: 1.5rem;
        line-height: 1.6;
      }
      
      .noscript-content a {
        color: #34d399;
        text-decoration: underline;
      }
      
      .noscript-content a:hover {
        color: #22d3ee;
      }
      
      /* Hide noscript content when JS is enabled */
      .js-enabled .noscript-content {
        display: none;
      }
    </style>
    
    <!-- Detect JavaScript -->
    <script>
      document.documentElement.classList.add('js-enabled');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', (e) => {
        var errDiv = document.getElementById('debug-error-banner');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'debug-error-banner';
          errDiv.style = 'position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fee2e2;padding:16px;z-index:99999;font-family:monospace;font-size:14px;white-space:pre-wrap;border-top:2px solid #ef4444;max-height:50vh;overflow:auto;';
          document.body.appendChild(errDiv);
        }
        errDiv.textContent += (e.error ? (e.error.stack || e.error.message) : e.message) + '\n';
      });
      window.addEventListener('unhandledrejection', (e) => {
        var errDiv = document.getElementById('debug-error-banner');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'debug-error-banner';
          errDiv.style = 'position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fee2e2;padding:16px;z-index:99999;font-family:monospace;font-size:14px;white-space:pre-wrap;border-top:2px solid #ef4444;max-height:50vh;overflow:auto;';
          document.body.appendChild(errDiv);
        }
        errDiv.textContent += 'Unhandled Promise Rejection: ' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : '') + '\n';
      });
    </script>
    
    <!-- No-JS fallback content -->
    <noscript>
      <div class="noscript-content">
        <h1>NextJob — Apply with Proof</h1>
        <p>
          NextJob is an AI career agent that converts verified career evidence into eligible, 
          high-quality applications with proof for every claim.
        </p>
        <p>
          <strong>JavaScript is required</strong> to use NextJob. Please enable JavaScript in your browser settings 
          to access all features including:
        </p>
        <ul style="text-align: left; display: inline-block; margin: 1.5rem 0;">
          <li>Interactive ROI calculator</li>
          <li>Dark/Light mode toggle</li>
          <li>Mobile-responsive navigation</li>
          <li>Application tracking</li>
          <li>And more...</li>
        </ul>
        <p>
          Learn more about NextJob in our <a href="/privacy">Privacy Policy</a> and 
          <a href="/terms">Terms of Service</a>.
        </p>
      </div>
    </noscript>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
